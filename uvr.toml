[project]
name = "factor-library"
r_version = "==4.6.1"

# The sorts follow the rules of tidyfinance at this commit of its development
# version, until the next release on CRAN. nanoparquet 0.5.2 fixes how 0.5.1
# reads a selection of columns with missing values.
[dependencies]
cli = ">=3.6.5"
config = ">=0.3.2"
"data.table" = ">=1.18.4"
dplyr = ">=1.2.1"
googledrive = ">=2.1.2"
lubridate = ">=1.9.5"
mirai = ">=2.7.1"
mori = ">=0.2.1"
nanoparquet = ">=0.5.2"
purrr = ">=1.2.2"
tidyfinance = { git = "tidy-finance/r-tidyfinance", rev = "bf87021f11c2dcd5fb947b4dce517e870a582eb9" }
tidyr = ">=1.3.2"
vctrs = ">=0.7.3"
